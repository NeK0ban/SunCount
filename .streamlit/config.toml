# Настройки калькулятора SunCount (Streamlit). Запуск: python -m streamlit run app/streamlit_app.py

[client]
# Без кнопки Deploy и меню разработчика: пользователю они не нужны
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f6fb2"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1b2430"
borderColor = "#dde3ea"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
font = "sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#f3f5f8"
